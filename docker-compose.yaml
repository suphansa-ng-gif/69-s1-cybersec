services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - 54327:5432
    environment:
      - POSTGRES_PASSWORD=s@2004
      - POSTGRES_USER=suphansa
      - POSTGRES_DB=suphansa
    volumes:
      - ./data:/var/lib/postgresql/data
      
  admin:
      image: dpage/pgadmin4
      container_name: 69-s1-admin
      depends_on:
        - db
      ports:
        - "8081:80"
      environment:
        PGADMIN_DEFAULT_EMAIL: suphansa-ng@rmutp.ac.th
        PGADMIN_DEFAULT_PASSWORD: s@2004
      volumes:
        - data-pgadmin:/var/lib/pgadmin
  app:
      image: prawee/strapi
      container_name: 69-s1-app
      porst:
        - "9091:1337"
      environment:
        DATABASE_CLIENT: postgress
        DATABASE_HOST: 69-s1-db
        DATABASE_PORST: 5432
        DATABASE_NAME: suphansa
        DATABASE_USERNAME: suphansa
        DATABASE_PASSWORD: s@2004

volumes:
  data-pgadmin:
  
    
